name: calma
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.2+1
  path: ^1.9.1
  image_picker: ^1.0.4
  video_player: ^2.8.2
  timeago: ^3.6.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8
  provider: ^6.0.5
  http: ^1.2.0

  # FIREBASE
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.3
  firebase_storage: ^12.3.6
  firebase_auth: ^5.7.0
  flutter_local_notifications: ^17.1.2
  path_provider: ^2.1.0
  firebase_messaging: ^15.2.10

  swipe_to: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# CONFIGURACION DEL ICONO
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true

  assets:
    - imagenes/fondo AI.jpg
    - imagenes/fondo_login.png
    - imagenes/nat.jpg
    - imagenes/Animacion.png